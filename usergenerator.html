
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random User Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <div class="container py-5">

        <h1 class="text-primary text-center mb-4">
            Random User Generator
        </h1>

        <div class="d-flex justify-content-center gap-2 mb-5">

            <input type="number" id="usercount"
                class="form-control w-25"
                placeholder="Enter number of users"
                min="1" max="20">

            <button class="btn btn-primary" onclick="getUsers()">
                Generate
            </button>

        </div>

        <div id="result" class="row g-4">

        </div>

    </div>


    <script>

        // FETCH RANDOM USERS

        const getUsers = async () => {

            const count = Number(usercount.value) || 1;

            if (count < 1 || count > 20) {
                alert("Enter a number between 1 and 20");
                return;
            }

            try {

                const response = await fetch(
                    `https://randomuser.me/api/?results=${count}`
                );

                const data = await response.json();

                console.log(data);

                displayUsers(data.results);

            }
            catch (error) {

                console.log(error);

                alert("Something went wrong");

            }

        }


        // DISPLAY USERS

        const displayUsers = (users) => {

            result.innerHTML = "";

            users.forEach(user => {

                result.innerHTML += `

                    <div class="col-md-4">

                        <div class="card shadow p-3 h-100 text-center">

                            <img src="${user.picture.large}"
                                class="rounded-circle mx-auto mb-3"
                                width="120"
                                height="120">

                            <h4>
                                ${user.name.first} ${user.name.last}
                            </h4>

                            <p>
                                Email: ${user.email}
                            </p>

                            <p>
                                Location: ${user.location.city},
                                ${user.location.country}
                            </p>

                            <p>
                                Phone: ${user.phone}
                            </p>

                        </div>

                    </div>

                `;

            });

        }

    </script>

</body>

</html>
